name: Simulation Soak

# Every six hours and on main: legacy model checks plus a bounded production
# source M3 + Int64 SUM/COUNT/AVG + pre-ack restart scenario (#125).
# The legacy 100k seed loop is not production operator/recovery evidence.

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: simulation-soak-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  soak:
    name: Model checks and incremental recovery seeds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Run simulation soak tests
        run: cargo test -p rockstream-sim --features simulation --test chaos_tests -- --nocapture
      - name: Verify bounded production incremental recovery seeds
        env:
          ROCKSTREAM_INCREMENTAL_CHAOS_SEEDS: "32"
          ROCKSTREAM_INCREMENTAL_CHAOS_ARTIFACT_DIR: ${{ github.workspace }}/target/incremental-chaos
        run: cargo test -p rockstream-sim --features simulation --test chaos_tests incremental_chaos::bounded_seed_run -- --exact
      - name: Upload incremental recovery histories and transitions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-chaos
          path: target/incremental-chaos/
          if-no-files-found: error
      - name: Verify seed corpus covers all registered laws
        run: |
          cargo test -p rockstream-sim --features simulation --test chaos_tests \
            proof_seed_corpus_covers_all_registered_laws -- --nocapture
