# Real Cluster Chaos Soak Workflow (v0.58.1)
# Enforces production failure matrix real-backend counterparts against absolute SLOs:
# - Failure detection: <= 5s p99
# - Shard reassignment: <= 30s p99
# - Freshness recovery: <= 60s p99
# - Sustained throughput: >= 1 rows/s
# - Zero loss & zero duplicates
#
# Documented Per-Cell Time Budgets:
# - FM-001 (Worker loss): 30s
# - FM-002 (Control-node loss): 15s
# - FM-003 (Exchange interruption): 20s
# - FM-004 (Source disconnect): 30s
# - FM-005 (MinIO brownout): 45s
# - FM-006 (Spill/compaction): 60s (Reasoned Exemption / real binary soak)
# - FM-007 (Checkpoint interruption): 25s
# - FM-008 (Sink 2PC failure): 30s
# - FM-009 (Shard migration): 30s (Reasoned Exemption / multi-worker test)
# - FM-010 (Rolling upgrade): 60s
# - FM-011 (Resource exhaustion): 30s
# Total Suite Runtime Budget: <= 300s (5m)

name: Real Cluster Chaos Soak

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"
  pull_request:
    paths:
      - "crates/rockstream-connectors/**"
      - "crates/rockstream-control/**"
      - "crates/rockstream-gateway/**"
      - "crates/rockstream-ops/**"
      - "crates/rockstream-runtime/**"
      - "crates/rockstream-sim/**"
      - "crates/rockstream-sql/**"
      - "crates/rockstream-storage/**"
      - "crates/rockstream-plan/**"
      - "crates/rockstream-types/**"
      - "crates/rockstream-oracle/**"
      - "crates/rockstream-cli/**"
      - "crates/rockstream-diff/**"
      - "crates/rockstream-test-support/**"
      - "formal/edge_*.fizz"
      - "Dockerfile"

jobs:
  chaos:
    runs-on: ubuntu-latest
    env:
      ROCKSTREAM_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: Require Docker
        run: docker info
      - name: Build unified-binary test image
        run: docker build -t rockstream-tc-test:latest .
      - name: Run Kafka/MinIO recovery SLO proof
        env:
          ROCKSTREAM_CHAOS_ARTIFACT_DIR: target/real-cluster-chaos
        run: cargo test -p rockstream-sim --features docker_tests --test real_cluster_chaos_soak_tests real_cluster_chaos_soak_kafka_minio_absolute_slos_and_exact_oracle -- --exact
      - name: Upload real-cluster chaos artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-cluster-chaos-slo-summary
          path: target/real-cluster-chaos/
          if-no-files-found: error
      - name: Append chaos summary to job summary
        if: always()
        run: cat target/real-cluster-chaos/real-cluster-chaos-summary.md >> "$GITHUB_STEP_SUMMARY"
