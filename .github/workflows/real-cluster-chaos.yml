# One worker failure against real Kafka and MinIO; one sample, no p99 claim.

name: Real Cluster Chaos Soak

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"
  pull_request:
    paths:
      - "crates/rockstream-connectors/**"
      - "crates/rockstream-control/**"
      - "crates/rockstream-gateway/**"
      - "crates/rockstream-ops/**"
      - "crates/rockstream-runtime/**"
      - "crates/rockstream-sim/**"
      - "crates/rockstream-sql/**"
      - "crates/rockstream-storage/**"
      - "crates/rockstream-plan/**"
      - "crates/rockstream-types/**"
      - "crates/rockstream-verified/**"
      - "crates/rockstream-oracle/**"
      - "crates/rockstream-cli/**"
      - "crates/rockstream-diff/**"
      - "crates/rockstream-docgen/**"
      - "crates/rockstream-management-proto/**"
      - "crates/rockstream-test-support/**"
      - "formal/edge_*.fizz"
      - "Dockerfile"
      - "docs/testing/worker-failure-kafka-minio-v1.json"
      - "docs/testing/worker-stale-owner-kafka-minio-v1.json"
      - "scripts/release-qualification*"
      - "scripts/run-release-qualification.sh"
      - ".github/workflows/real-cluster-chaos.yml"
      - "!**/AGENTS.md"
      - "!**/openwiki/**"
      - "!**/.openwikiignore"

concurrency:
  group: real-cluster-chaos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROCKSTREAM_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - name: Require Docker
        run: docker info
      - name: Test qualification record validation
        run: |
          bash scripts/check-qualification-mutations.test.sh
          cargo test --locked -p rockstream-sim --lib qualification::worker_failure
      - name: Qualify observed worker-failure recovery and corrupted records
        run: bash scripts/run-release-qualification.sh --suite recovery --output target/real-cluster-chaos/qualification.json
      - name: Reject stale-owner writes, ACKs, and frontier reports
        env:
          ROCKSTREAM_CHAOS_ARTIFACT_DIR: ${{ github.workspace }}/target/real-cluster-chaos/stale-owner
        run: cargo test --locked -p rockstream-sim --features simulation,docker_tests --test real_cluster_chaos_soak_tests stale_worker_write_and_frontier_report_are_rejected_after_reassignment -- --exact --test-threads=1
      - name: Upload real-cluster chaos artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-cluster-chaos-slo-summary
          path: ${{ github.workspace }}/target/real-cluster-chaos/
          if-no-files-found: error
      - name: Append chaos summary to job summary
        if: always()
        run: |
          cat target/real-cluster-chaos/recovery-*/real-cluster-chaos-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f target/real-cluster-chaos/stale-owner/stale-owner-summary.md ]; then cat target/real-cluster-chaos/stale-owner/stale-owner-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
