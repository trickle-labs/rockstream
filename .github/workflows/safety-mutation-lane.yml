name: Safety Mutation Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 3"

permissions:
  contents: read

concurrency:
  group: safety-mutation-lane
  cancel-in-progress: false

jobs:
  safety-mutations:
    name: Reviewed P0/P1 sample (not a PR gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: safety-mutation-lane-rust-1.95
      - name: Require Docker for the stale-owner real-process detector
        run: docker info
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Test exact source, execution, and reporting gates
        run: python3 scripts/run_safety_mutation_lane_test.py -q
      - name: Run the fixed reviewed candidate set
        run: python3 scripts/run_safety_mutation_lane.py --output-dir "$RUNNER_TEMP/safety-mutation-results"
      - name: Retain source, mutation, baseline, and mutant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-mutation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safety-mutation-results/
          retention-days: 30
          if-no-files-found: error
