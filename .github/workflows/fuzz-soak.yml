name: Scheduled Fuzz Soak

on:
  schedule:
    - cron: "41 4,10,16,22 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fuzz-soak.yml"
      - "Cargo.lock"
      - "scripts/run-fuzz.py"
      - "scripts/run-fuzz.test.py"
      - "scripts/fixtures/fuzz-engine/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-soak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2026-04-17

jobs:
  runner-self-test:
    name: Fuzz runner failure and execution gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-17
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/fixtures/fuzz-engine -> ../../../target/fuzz-fixtures
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked
      - name: Build real engine fixtures
        run: cargo fuzz build --dev --fuzz-dir scripts/fixtures/fuzz-engine --target-dir target/fuzz-fixtures
      - name: Prove crash capture, minimization, replay, and zero-execution rejection
        run: python3 scripts/run-fuzz.test.py --bin-dir target/fuzz-fixtures/x86_64-unknown-linux-gnu/debug -q
      - name: Retain deliberate-failure proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-runner-self-test-${{ github.sha }}
          path: target/fuzz-self-test-results/
          if-no-files-found: error

  fuzz-soak:
    name: Bounded byte-decoder engine runs
    if: github.event_name != 'pull_request'
    needs: runner-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-17
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/fuzz
          cache-all-crates: true
      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked
      - name: Restore accumulated corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-v1-
      - name: Restore checked-in regression and known-valid seeds
        run: git restore fuzz/corpus
      - name: Build every registered instrumented decoder
        run: cargo fuzz build --dev --target-dir target/fuzz
      - name: Run every decoder for 120 seconds (5 seconds per input, 2048 MiB RSS)
        run: python3 scripts/run-fuzz.py --bin-dir target/fuzz/x86_64-unknown-linux-gnu/debug
      - name: Persist useful corpus additions even after a failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain inputs, minimized failures, replay logs, and run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-byte-decoders-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/fuzz-results/
            fuzz/corpus/
          retention-days: 90
          if-no-files-found: error
