name: Coverage

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  ROCKSTREAM_REQUIRE_DOCKER: "1"

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Require Docker
        run: docker info
      - uses: docker/setup-buildx-action@v3
      - name: Build unified-binary test image
        run: |
          docker buildx build \
            --tag rockstream-tc-test:latest \
            --load \
            --cache-from type=gha,scope=rockstream-tc-test-coverage \
            --cache-to type=gha,mode=max,scope=rockstream-tc-test-coverage \
            .
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov (workspace lcov)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          ROCKSTREAM_CONFORMANCE_REPORT_PRODUCER: "1"
          ROCKSTREAM_RESOURCE_SOAK_DURATION_SECS: "60"
          ROCKSTREAM_RESOURCE_SOAK_SAMPLE_INTERVAL_SECS: "10"
        run: |
          cargo llvm-cov --workspace --exclude rockstream-connectors --exclude rockstream-control --exclude rockstream-gateway --exclude rockstream-ops --exclude rockstream-runtime --exclude rockstream-storage --exclude rockstream-sim --exclude rockstream-sql --lib --tests --no-report
          cargo llvm-cov --no-clean -p rockstream-connectors --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-control --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-gateway --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-ops --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-runtime --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-storage --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-sql --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-sim --features simulation --lib
          cargo llvm-cov --no-clean -p rockstream-gateway --features testcontainers --test auth_scram_tests --test driver_matrix_tests --test query_time_multi_shard_scatter_minio_tests --test reference_app_tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-sim --features simulation --lib -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-sim --features simulation --test az_aware_exchange_sim_tests --test control_sim --test frontier_publisher_election --test hot_key_detection_sim_tests --test lock_poisoning_sim_tests --test query_time_scatter_sim_tests --test recursive_cte_sim_tests --test shard_merge_sim_tests --test shard_migration_sim_tests --test shard_split_sim_tests --test shard_stats_checkpoint_sim_tests --test sim_aggregate_coordination_tests --test skew_control_loop_sim_tests --test worker_drain_sim_tests
          cargo llvm-cov --no-clean -p rockstream-sim --features simulation --test control_plane_ha_tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-sim --features docker_tests --test real_cluster_chaos_soak_tests --test resource_leak_soak_real_binary_tests -- --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info
      # Collect the complete explicit feature matrix once. The per-crate checks
      # below are report-only so every floor uses the same profile.
      - name: cargo llvm-cov (rockstream-gateway lines ≥76%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-gateway --fail-under-lines 76
      - name: cargo llvm-cov (rockstream-gateway regions ≥77%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-gateway --fail-under-regions 77
      - name: cargo llvm-cov (rockstream-docgen lines ≥70%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-docgen --fail-under-lines 70
      - name: cargo llvm-cov (rockstream-docgen regions ≥70%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-docgen --fail-under-regions 70
      - name: cargo llvm-cov (rockstream-management-proto lines ≥70%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-management-proto --fail-under-lines 70
      - name: cargo llvm-cov (rockstream-management-proto regions ≥70%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-management-proto --fail-under-regions 70
      - name: cargo llvm-cov (rockstream-diff lines ≥76%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-diff --fail-under-lines 76
      - name: cargo llvm-cov (rockstream-diff regions ≥71%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-diff --fail-under-regions 71
      - name: cargo llvm-cov (rockstream-ops lines ≥81%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-ops --fail-under-lines 81
      - name: cargo llvm-cov (rockstream-ops regions ≥81%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-ops --fail-under-regions 81
      - name: cargo llvm-cov (rockstream-storage lines ≥75%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-storage --fail-under-lines 75
      - name: cargo llvm-cov (rockstream-storage regions ≥75%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-storage --fail-under-regions 75
      - name: cargo llvm-cov (rockstream-runtime lines ≥76%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-runtime --fail-under-lines 76
      - name: cargo llvm-cov (rockstream-runtime regions ≥79%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-runtime --fail-under-regions 79
      - name: cargo llvm-cov (rockstream-sql lines ≥73%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-sql --fail-under-lines 73
      - name: cargo llvm-cov (rockstream-sql regions ≥74%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-sql --fail-under-regions 74
      - name: cargo llvm-cov (rockstream-control lines ≥76%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-control --fail-under-lines 76
      - name: cargo llvm-cov (rockstream-control regions ≥77%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-control --fail-under-regions 77
      - name: cargo llvm-cov (rockstream-connectors lines ≥70%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-connectors --fail-under-lines 70
      - name: cargo llvm-cov (rockstream-connectors regions ≥71%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-connectors --fail-under-regions 71
      - name: cargo llvm-cov (rockstream-types lines ≥84%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-types --fail-under-lines 84
      - name: cargo llvm-cov (rockstream-types regions ≥86%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-types --fail-under-regions 86
      - name: cargo llvm-cov (rockstream-plan lines ≥81%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-plan --fail-under-lines 81
      - name: cargo llvm-cov (rockstream-plan regions ≥81%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-plan --fail-under-regions 81
      - name: cargo llvm-cov (rockstream-sim lines ≥63%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-sim --fail-under-lines 63
      - name: cargo llvm-cov (rockstream-sim regions ≥66%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-sim --fail-under-regions 66
      - name: cargo llvm-cov (rockstream-cli lines ≥72%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-cli --fail-under-lines 72 --ignore-filename-regex '/rockstream-cli/src/main[.]rs$'
      - name: cargo llvm-cov (rockstream-cli regions ≥73%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-cli --fail-under-regions 73 --ignore-filename-regex '/rockstream-cli/src/main[.]rs$'
      - name: cargo llvm-cov (rockstream-oracle lines ≥83%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-oracle --fail-under-lines 83
      - name: cargo llvm-cov (rockstream-oracle regions ≥81%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-oracle --fail-under-regions 81
      - name: cargo llvm-cov (rockstream-test-support lines ≥70%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-test-support --fail-under-lines 70
      - name: cargo llvm-cov (rockstream-test-support regions ≥70%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-test-support --fail-under-regions 70
      - name: upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
