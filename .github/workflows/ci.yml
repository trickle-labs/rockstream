name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  ROCKSTREAM_REQUIRE_DOCKER: "1"

jobs:
  control-plane-ha:
    name: Control-plane HA smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Require Docker
        run: docker info
      - name: Build unified-binary test image
        run: docker build -t rockstream-tc-test:latest .
      - name: Control-plane HA tests
        env:
          RS_TC_DEBUG: "1"
        run: cargo test -p rockstream-sim --features simulation --test control_plane_ha_tests -- --test-threads=1 --nocapture

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Require Docker
        run: docker info
      - name: Build unified-binary test image
        run: docker build -t rockstream-tc-test:latest .
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::uninlined_format_args
      - name: cargo test
        env:
          ROCKSTREAM_CONFORMANCE_REPORT_PRODUCER: "1"
          ROCKSTREAM_RESOURCE_SOAK_DURATION_SECS: "60"
          ROCKSTREAM_RESOURCE_SOAK_SAMPLE_INTERVAL_SECS: "10"
        run: |
          cargo test --workspace --exclude rockstream-connectors --exclude rockstream-control --exclude rockstream-gateway --exclude rockstream-ops --exclude rockstream-runtime --exclude rockstream-storage --exclude rockstream-sim --exclude rockstream-sql
          cargo test -p rockstream-connectors --lib --tests -- --test-threads=1
          cargo test -p rockstream-control --lib --tests -- --test-threads=1
          cargo test -p rockstream-gateway --lib --tests -- --test-threads=1
          cargo test -p rockstream-ops --lib --tests -- --test-threads=1
          cargo test -p rockstream-runtime --lib --tests -- --test-threads=1
          cargo test -p rockstream-storage --lib --tests -- --test-threads=1
          cargo test -p rockstream-sql --lib --tests -- --test-threads=1
          cargo test -p rockstream-gateway --features testcontainers --test auth_scram_tests --test driver_matrix_tests --test query_time_multi_shard_scatter_minio_tests --test reference_app_tests -- --test-threads=1
          cargo test -p rockstream-sim --features simulation --lib -- --test-threads=1
          cargo test -p rockstream-sim --features simulation --test az_aware_exchange_sim_tests --test control_sim --test frontier_publisher_election --test hot_key_detection_sim_tests --test lock_poisoning_sim_tests --test query_time_scatter_sim_tests --test recursive_cte_sim_tests --test shard_merge_sim_tests --test shard_migration_sim_tests --test shard_split_sim_tests --test shard_stats_checkpoint_sim_tests --test sim_aggregate_coordination_tests --test skew_control_loop_sim_tests --test worker_drain_sim_tests
          cargo test -p rockstream-sim --features simulation --test control_plane_ha_tests -- --test-threads=1
          cargo test -p rockstream-sim --features docker_tests --test real_cluster_chaos_soak_tests --test resource_leak_soak_real_binary_tests -- --test-threads=1
      - name: pgwire conformance test-result report
        run: |
          rm -f target/pgwire-test-results.json
          ROCKSTREAM_CONFORMANCE_REPORT_PRODUCER=1 RUSTC_BOOTSTRAP=1 cargo test --quiet --all-features -p rockstream-gateway --test auth_scram_tests --test gateway_dml_tests --test gateway_extended_query_tests --test gateway_integration_tests --test gateway_proof_tests --test golden_wire_tests --test listen_notify_tests --test transaction_savepoint_tests -- -Z unstable-options --format json > target/pgwire-test-results.json
          cargo test -p rockstream-gateway --test conformance_doc_tests test_conformance_doc_has_linked_tests -- --exact
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit $(grep -oE '"RUSTSEC-[0-9]{4}-[0-9]{4}"' deny.toml | tr -d '"' | sed 's/^/--ignore /')
      - name: threat-model link check
        run: bash scripts/check-threat-model-links.sh
      - name: threat-model checker self-test
        run: bash scripts/check-threat-model-links.test.sh
      - name: dependency-audit checker self-test
        run: bash scripts/check-dependency-audit.test.sh
      - name: documentation admission gate
        run: bash scripts/check-documentation.sh
      - name: documentation checker self-test
        run: bash scripts/check-documentation.test.sh
      - name: error-code enforcement
        run: bash scripts/check-error-codes.sh
      - name: error-code checker self-test
        run: bash scripts/check-error-codes.test.sh
      - name: poisoning-lock check
        run: bash scripts/check-no-poisoning-locks.sh
      - name: poisoning-lock checker self-test
        run: bash scripts/check-no-poisoning-locks.test.sh
      - name: invariant-pairs cross-check
        run: bash scripts/check-invariant-pairs.sh
      - name: invariant-pairs checker self-test
        run: bash scripts/check-invariant-pairs.test.sh
      - name: no-hardcoded-query-rewrites cross-check
        run: bash scripts/check-no-hardcoded-query-rewrites.sh
      - name: no-hardcoded-query-rewrites checker self-test
        run: bash scripts/check-no-hardcoded-query-rewrites.test.sh
      - name: no-mock-connectors cross-check
        run: bash scripts/check-no-mock-connectors.sh
      - name: no-mock-connectors checker self-test
        run: bash scripts/check-no-mock-connectors.test.sh
      - name: connector-admission gate
        run: bash scripts/check-connector-admission.sh
      - name: connector-admission checker self-test
        run: bash scripts/check-connector-admission.test.sh
      - name: exit criteria sign-offs
        run: bash scripts/check-exit-criteria.sh
      - name: exit criteria checker self-test
        run: bash scripts/check-exit-criteria.test.sh
      - name: capability contract gate
        run: bash scripts/check-capability-contract.sh
      - name: capability contract checker self-test
        run: bash scripts/check-capability-contract.test.sh
      - name: operator-state-bytes check
        run: bash scripts/check-operator-state-bytes.sh
      - name: operator-state-bytes checker self-test
        run: bash scripts/check-operator-state-bytes.test.sh
      - name: path-coupling check
        run: bash scripts/check-path-coupling.sh

  formal-verify:
    name: Formal verify (M1–M4, M6–M7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether formal verification applies
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=50
            base_sha=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
            changed=$(git diff --name-only "$base_sha"...HEAD)
            if echo "$changed" | grep -qE '^(formal/|DESIGN\.md|crates/rockstream-(runtime|control|connectors|storage|sim|ops|gateway|sql|types|plan|oracle|cli|diff|test-support)/)'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # push to main / tags always runs the full formal-verify suite.
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install FizzBee
        if: steps.filter.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # v0.42.1 fix: the previous URL (fizzbee-linux-amd64.tar.gz under
          # .../releases/latest/download/...) never matched a real asset —
          # fizzbee-io/fizzbee publishes versioned filenames
          # (e.g. fizzbee-v0.5.2-linux_x86.tar.gz), which the GitHub
          # "latest/download/<fixed-name>" convention cannot address. Resolve
          # the real asset URL from the Releases API instead.
          #
          # v0.42.3 fix: the first real run of this hard-gated job (after M4
          # was folded in, removing `continue-on-error`) failed with
          # `curl: (22) ... 403` on this API call — GitHub's unauthenticated
          # API rate limit (60 req/hour per source IP) is easily exhausted on
          # shared GitHub-hosted runner IPs. Authenticate with the job's own
          # `GITHUB_TOKEN` (5,000 req/hour) to make this reliable.
          url=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/fizzbee-io/fizzbee/releases/latest \
            | grep -oE '"browser_download_url": *"[^"]*linux_x86\.tar\.gz"' \
            | grep -oE 'https://[^"]+' | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not resolve a fizzbee linux_x86 release asset from the GitHub API."
            exit 1
          fi
          echo "Resolved fizzbee asset: $url"
          curl -fsSL -o /tmp/fizzbee.tar.gz "$url"
          mkdir -p /tmp/fizzbee-install
          tar -xzf /tmp/fizzbee.tar.gz -C /tmp/fizzbee-install
          # v0.42.1 fix: `make verify` invokes the `fizz` wrapper script, not
          # the bare `fizzbee` binary. The wrapper needs its sibling files
          # (fizz.env, parser/, mbt_gen.zip) alongside it, so the whole
          # extracted directory — not just one file — must be on PATH.
          install_dir=$(find /tmp/fizzbee-install -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/fizzbee" --version || true
      # M1 (smoke + epoch-commit), M2 (frontier aggregation), M3 (sink 2PC),
      # M4 (self-fencing), M6 (shard migration), and M7
      # (control-plane Raft leader election, v0.45.2) are all genuinely green
      # (safety + liveness) — see formal/findings.md "Post-v0.42.3
      # Remediation" and the M7 entry. All seven specs are a hard gate: a red
      # result here blocks merge, per the binding v0.18 contract. M4's
      # exhaustive BFS completes in ~6s / ~31,000 nodes at MAX_OUTAGES
      # lowered from 2 to 1 (every other bound unchanged from its original
      # committed value — see formal/m4_self_fencing.fizz and findings.md
      # for the full state-space analysis); its former
      # `continue-on-error`/non-blocking special-casing and per-subshell
      # memory/wall-clock caps are removed. M7 completes in ~5s /
      # ~37,000 nodes at NUM_CONTROL_NODES=3, MAX_ELECTIONS=2,
      # MAX_WRITE_ATTEMPTS=2 — the pre-implementation gate for v0.45.2's
      # `rockstream-control` Raft group, per the binding v0.18 rule that
      # S0 (the model) must be green before S1+ (implementation) is written.
      - name: Formal verify — smoke, M1, M2, M3, M4, M6, M7, edge models (hard gate)
        if: steps.filter.outputs.run == 'true'
        run: |
          fizz formal/smoke.fizz
          fizz formal/m1_epoch_commit.fizz
          fizz formal/m2_frontier_agg.fizz
          fizz formal/m3_sink_2pc.fizz
          fizz formal/m4_self_fencing.fizz
          fizz formal/m6_shard_migration.fizz
          fizz formal/m7_control_plane_ha.fizz
          fizz formal/edge_quota_exhaustion.fizz
          fizz formal/edge_late_data.fizz

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Require Docker
        run: docker info
      - name: Build unified-binary test image
        run: docker build -t rockstream-tc-test:latest .
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov (workspace lcov)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          ROCKSTREAM_CONFORMANCE_REPORT_PRODUCER: "1"
          ROCKSTREAM_RESOURCE_SOAK_DURATION_SECS: "60"
          ROCKSTREAM_RESOURCE_SOAK_SAMPLE_INTERVAL_SECS: "10"
        run: |
          cargo llvm-cov --workspace --exclude rockstream-connectors --exclude rockstream-control --exclude rockstream-gateway --exclude rockstream-ops --exclude rockstream-runtime --exclude rockstream-storage --exclude rockstream-sim --exclude rockstream-sql --lib --tests --no-report
          cargo llvm-cov --no-clean -p rockstream-connectors --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-control --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-gateway --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-ops --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-runtime --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-storage --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-sql --lib --tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-gateway --features testcontainers --test auth_scram_tests --test driver_matrix_tests --test query_time_multi_shard_scatter_minio_tests --test reference_app_tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-sim --features simulation --lib -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-sim --features simulation --test az_aware_exchange_sim_tests --test control_sim --test frontier_publisher_election --test hot_key_detection_sim_tests --test lock_poisoning_sim_tests --test query_time_scatter_sim_tests --test recursive_cte_sim_tests --test shard_merge_sim_tests --test shard_migration_sim_tests --test shard_split_sim_tests --test shard_stats_checkpoint_sim_tests --test sim_aggregate_coordination_tests --test skew_control_loop_sim_tests --test worker_drain_sim_tests
          cargo llvm-cov --no-clean -p rockstream-sim --features simulation --test control_plane_ha_tests -- --test-threads=1
          cargo llvm-cov --no-clean -p rockstream-sim --features docker_tests --test real_cluster_chaos_soak_tests --test resource_leak_soak_real_binary_tests -- --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info
      # Collect the complete explicit feature matrix once. The per-crate checks
      # below are report-only so every floor uses the same profile.
      - name: cargo llvm-cov (rockstream-gateway lines ≥76%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-gateway --fail-under-lines 76
      - name: cargo llvm-cov (rockstream-gateway regions ≥77%)
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: cargo llvm-cov report --package rockstream-gateway --fail-under-regions 77
      - name: cargo llvm-cov (rockstream-docgen lines ≥70%)
