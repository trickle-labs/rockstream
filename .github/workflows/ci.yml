name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/AGENTS.md"
      - "**/openwiki/**"
      - "**/.openwikiignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/AGENTS.md"
      - "**/openwiki/**"
      - "**/.openwikiignore"
  workflow_dispatch:
  schedule:
    # PRs and main pushes retain the full gate; this clean-state pass is weekly.
    - cron: "47 20 * * 1"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  ROCKSTREAM_REQUIRE_DOCKER: "1"

jobs:
  ci-policy:
    name: Select qualification lane
    runs-on: ubuntu-latest
    outputs:
      expensive: ${{ steps.select.outputs.expensive }}
      scope: ${{ steps.select.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: python3 scripts/ci-selection.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selection
          path: target/ci-selection.json
          if-no-files-found: error

  control-plane-ha:
    name: Control-plane HA smoke
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Require Docker
        run: docker info
      - uses: ./.github/actions/load-candidate-image
        with:
          image-id: ${{ needs.docker-build.outputs.image-id }}
      - name: Record HA test case execution
        env:
          RS_TC_DEBUG: "1"
        run: python3 scripts/ci-test-inventory.py run --job pr-ha
      - name: Upload HA test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-accounting-ha
          path: target/ci-test-results/
          if-no-files-found: error

  check-quality:
    needs: ci-policy
    name: Check quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        if: needs.ci-policy.outputs.scope == 'full'
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.ci-policy.outputs.scope == 'full'
      - name: Free runner disk space
        if: needs.ci-policy.outputs.scope == 'full'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: cargo fmt
        if: needs.ci-policy.outputs.scope == 'full'
        run: cargo fmt --all --check
      - name: cargo clippy
        if: needs.ci-policy.outputs.scope == 'full'
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::uninlined_format_args
      - name: install cargo-deny
        if: needs.ci-policy.outputs.scope == 'full'
        uses: taiki-e/install-action@cargo-deny
      - name: cargo deny
        if: needs.ci-policy.outputs.scope == 'full'
        run: cargo deny --all-features check
      - name: install cargo-audit
        if: needs.ci-policy.outputs.scope == 'full'
        uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        if: needs.ci-policy.outputs.scope == 'full'
        run: cargo audit $(grep -oE '"RUSTSEC-[0-9]{4}-[0-9]{4}"' deny.toml | tr -d '"' | sed 's/^/--ignore /')
      - name: threat-model link check
        run: bash scripts/check-threat-model-links.sh
      - name: threat-model checker self-test
        run: bash scripts/check-threat-model-links.test.sh
      - name: dependency-audit checker self-test
        run: bash scripts/check-dependency-audit.test.sh
      - name: documentation admission gate
        run: bash scripts/check-documentation.sh
      - name: documentation checker self-test
        run: bash scripts/check-documentation.test.sh
      - name: error-code enforcement
        run: bash scripts/check-error-codes.sh
      - name: error-code checker self-test
        run: bash scripts/check-error-codes.test.sh
      - name: poisoning-lock check
        run: bash scripts/check-no-poisoning-locks.sh
      - name: poisoning-lock checker self-test
        run: bash scripts/check-no-poisoning-locks.test.sh
      - name: invariant-pairs cross-check
        run: bash scripts/check-invariant-pairs.sh
      - name: invariant-pairs checker self-test
        run: bash scripts/check-invariant-pairs.test.sh
      - name: no-hardcoded-query-rewrites cross-check
        run: bash scripts/check-no-hardcoded-query-rewrites.sh
      - name: no-hardcoded-query-rewrites checker self-test
        run: bash scripts/check-no-hardcoded-query-rewrites.test.sh
      - name: no-mock-connectors cross-check
        run: bash scripts/check-no-mock-connectors.sh
      - name: no-mock-connectors checker self-test
        run: bash scripts/check-no-mock-connectors.test.sh
      - name: Check production CLI fixture isolation
        run: bash scripts/check-no-fixture-dispatch.sh
      - name: Test production CLI fixture isolation gate
        run: bash scripts/check-no-fixture-dispatch.test.sh
      - name: connector-admission gate
        run: bash scripts/check-connector-admission.sh
      - name: connector-admission checker self-test
        run: bash scripts/check-connector-admission.test.sh
      - name: exit criteria sign-offs
        run: bash scripts/check-exit-criteria.sh
      - name: exit criteria checker self-test
        run: bash scripts/check-exit-criteria.test.sh
      - name: capability contract gate
        run: bash scripts/check-capability-contract.sh
      - name: capability contract checker self-test
        run: bash scripts/check-capability-contract.test.sh
      - name: operator-state-bytes check
        run: bash scripts/check-operator-state-bytes.sh
      - name: operator-state-bytes checker self-test
        run: bash scripts/check-operator-state-bytes.test.sh
      - name: CI test-accounting self-tests
        run: python3 scripts/ci-test-inventory.test.py
      - name: Benchmark scheduling self-tests
        run: python3 -B scripts/run-benchmark-gate.test.py
      - name: CI lane and image self-tests
        run: python3 scripts/ci-policy.test.py
      - name: CI prose-only scope and required-check self-tests
        run: python3 -B scripts/ci-scope.test.py
      - name: Validate Cargo test target assignment
        if: needs.ci-policy.outputs.scope == 'full'
        run: python3 scripts/ci-test-inventory.py check --out target/ci-test-results/assignment.json
      - name: path-coupling check
        run: bash scripts/check-path-coupling.sh
      - name: path-coupling checker self-test
        run: bash scripts/check-path-coupling.test.sh
      - name: qualification execution gate self-tests
        run: bash scripts/check-qualification-mutations.test.sh

  verus-qualify:
    name: VS6 clean phase (${{ matrix.os }}, ${{ matrix.phase }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        phase: [debug, release]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    needs: ci-policy
    if: needs.ci-policy.outputs.scope == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERUS_QUALIFICATION_TARGET: ${{ matrix.target }}
      VERUS_QUALIFICATION_OUTPUT: evidence/verus/${{ matrix.target }}/${{ matrix.phase }}
      VERUS_MUTATION_OUTPUT: evidence/verus/${{ matrix.target }}/${{ matrix.phase }}/mutations
      VERUS_QUALIFICATION_PHASE: ${{ matrix.phase }}
    steps:
      - name: Validate qualification selection
        env:
          EXPENSIVE: ${{ needs.ci-policy.outputs.expensive }}
        run: test "$EXPENSIVE" = true || test "$EXPENSIVE" = false
      - uses: actions/checkout@v4
        if: needs.ci-policy.outputs.expensive == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: needs.ci-policy.outputs.expensive == 'true'
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@master
        if: needs.ci-policy.outputs.expensive == 'true'
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: needs.ci-policy.outputs.expensive == 'true'
      - name: Cache pinned Verus
        if: needs.ci-policy.outputs.expensive == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/verus
          key: verus-${{ runner.os }}-${{ runner.arch }}-0.2026.09.13.671956e
      - name: Install pinned Verus
        if: needs.ci-policy.outputs.expensive == 'true'
        run: echo "$(bash scripts/install-verus.sh)" >> "$GITHUB_PATH"
      - name: Verify Rust kernels
        if: matrix.phase == 'debug'
        run: make verify-rust
      - name: Verify proof contracts
        if: matrix.phase == 'debug'
        run: make verify-proof-contracts
      - name: Run clean VS6 qualification matrix
        if: needs.ci-policy.outputs.expensive == 'true'
        run: make qualify-verus
      - name: Upload VS6 qualification evidence
        if: always() && needs.ci-policy.outputs.expensive == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verus-phase-${{ matrix.target }}-${{ matrix.phase }}
          overwrite: true
          path: evidence/verus/${{ matrix.target }}/${{ matrix.phase }}
          if-no-files-found: error
          retention-days: 14

  verus-verify:
    name: Verus verify and qualify (VS6)
    timeout-minutes: 90
    needs: [ci-policy, verus-qualify]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERUS_QUALIFICATION_OUTPUT: evidence/verus/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate all qualification phases or the explicit prose exclusion
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-scope.py check-verus
      - uses: dtolnay/rust-toolchain@master
        if: needs.ci-policy.outputs.scope == 'full'
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        if: needs.ci-policy.outputs.scope == 'full'
      - uses: actions/download-artifact@v4
        if: needs.ci-policy.outputs.scope == 'full'
        with:
          name: verus-phase-${{ matrix.target }}-debug
          path: target/verus-phases/debug
      - uses: actions/download-artifact@v4
        if: needs.ci-policy.outputs.scope == 'full'
        with:
          name: verus-phase-${{ matrix.target }}-release
          path: target/verus-phases/release
      - name: Assemble complete source-bound qualification
        if: needs.ci-policy.outputs.scope == 'full'
        env:
          QUALIFY_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/record-verus-qualification.py --root . --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --status passed --merge target/verus-phases --target "$QUALIFY_TARGET" \
            --output "$VERUS_QUALIFICATION_OUTPUT/qualification.json"
      - name: Exercise production wrapper
        if: needs.ci-policy.outputs.scope == 'full'
        run: cargo test --locked -p rockstream-plan --test virtual_bucket_routing_tests
      - name: Smoke-test the clean workspace Cargo consumers
        if: needs.ci-policy.outputs.scope == 'full'
        run: |
          "$VERUS_QUALIFICATION_OUTPUT/rockstream-debug" --help
          "$VERUS_QUALIFICATION_OUTPUT/rockstream-release" --help
      - name: Upload complete VS6 qualification evidence
        if: always() && needs.ci-policy.outputs.scope == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: verus-qualification-${{ matrix.target }}
          overwrite: true
          path: evidence/verus/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  verus-consumer:
    name: Ordinary CLI consumer (${{ matrix.os }})
    timeout-minutes: 90
    needs: ci-policy
    if: needs.ci-policy.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verus-ordinary-consumer
      # CLI-only feature resolution differs from the clean workspace qualification.
      - name: Build ordinary Cargo consumer
        run: cargo build --locked --release -p rockstream-cli

  check-tests:
    needs: ci-policy
    if: needs.ci-policy.outputs.scope == 'full'
    name: Check tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - workspace
          - crates
          - sim-unit
          - sim-integration
          - oracle
          - ops
          - storage-sql
          - gateway-components
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-tests-${{ matrix.shard }}
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Require Docker
        if: contains(fromJSON('["crates", "oracle", "ops", "storage-sql", "gateway-components"]'), matrix.shard)
        run: docker info
      - name: Record workspace test case execution
        if: matrix.shard == 'workspace'
        run: python3 scripts/ci-test-inventory.py run --job pr-workspace
      - name: Record crate test case execution
        if: matrix.shard == 'crates'
        run: python3 scripts/ci-test-inventory.py run --job pr-crates
      - name: Record simulation unit case execution
        if: matrix.shard == 'sim-unit'
        run: python3 scripts/ci-test-inventory.py run --job pr-sim-unit
      - name: Record all ordinary simulation integration cases
        if: matrix.shard == 'sim-integration'
        run: python3 scripts/ci-test-inventory.py run --job pr-sim
      - name: Record balanced package shard execution
        if: contains(fromJSON('["oracle", "ops", "storage-sql", "gateway-components"]'), matrix.shard)
        run: python3 scripts/ci-test-inventory.py run --job pr-${{ matrix.shard }}
      - name: Qualification helper checks (not release evidence)
        if: matrix.shard == 'sim-integration'
        run: bash scripts/run-release-qualification.sh --fast --output target/qualification-helpers.json
      - name: Upload qualification helper results
        if: always() && matrix.shard == 'sim-integration'
        uses: actions/upload-artifact@v4
        with:
          name: qualification-helpers
          path: target/qualification-helpers.json
          if-no-files-found: error
      - name: Upload exact test execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-accounting-${{ matrix.shard }}
          path: target/ci-test-results/
          if-no-files-found: error

  gateway:
    name: Check tests (gateway)
    needs: ci-policy
    if: needs.ci-policy.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-tests-gateway
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      # GatewayServer runs in process; its external services use their own images.
      - name: Require Docker
        run: docker info
      - name: Record gateway cases and PGWire conformance events once
        run: python3 scripts/ci-test-inventory.py run --job pr-gateway
      - name: Upload exact gateway test execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-accounting-gateway
          path: target/ci-test-results/
          if-no-files-found: error
      - name: Upload PGWire conformance events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgwire-conformance-${{ github.sha }}
          path: target/pgwire-test-results.json
          if-no-files-found: error

  postgres-differential:
    needs: ci-policy
    if: needs.ci-policy.outputs.scope == 'full'
    name: PostgreSQL 18.0 differential integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Require reference infrastructure
        run: |
          docker info
          docker pull postgres:18.0
      - name: Account for default-feature PostgreSQL differential cases
        run: python3 scripts/ci-test-inventory.py run --job pr-postgres-differential
      - name: Upload exact differential execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-accounting-postgres-differential
          path: target/ci-test-results/
          if-no-files-found: error

  check:
    name: Check
    if: always()
    needs:
      - ci-policy
      - check-quality
      - check-tests
      - gateway
      - postgres-differential
      - control-plane-ha
      - formal-verify
      - verus-verify
      - verus-consumer
      - nexmark-regression-gate
      - benchmark
      - docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required checks and explicitly scoped prose-only exclusions
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-scope.py check

  formal-verify:
    needs: ci-policy
    if: needs.ci-policy.outputs.scope == 'full'
    name: Formal verify (M1–M4, M6–M7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether formal verification applies
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=50
            base_sha=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
            changed=$(git diff --name-only "$base_sha"...HEAD)
            protocol_model_changed=false
            if echo "$changed" | grep -E '^formal/' | grep -qv '^formal/verus/'; then
              protocol_model_changed=true
            fi
            if echo "$changed" | grep -qE '^(DESIGN\.md|crates/rockstream-(runtime|control|connectors|storage|sim|ops|gateway|sql|types|plan|oracle|cli|diff|test-support)/)' || [ "$protocol_model_changed" = true ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # push to main / tags always runs the full formal-verify suite.
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install FizzBee
        if: steps.filter.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # v0.42.1 fix: the previous URL (fizzbee-linux-amd64.tar.gz under
          # .../releases/latest/download/...) never matched a real asset —
          # fizzbee-io/fizzbee publishes versioned filenames
          # (e.g. fizzbee-v0.5.2-linux_x86.tar.gz), which the GitHub
          # "latest/download/<fixed-name>" convention cannot address. Resolve
          # the real asset URL from the Releases API instead.
          #
          # v0.42.3 fix: the first real run of this hard-gated job (after M4
          # was folded in, removing `continue-on-error`) failed with
          # `curl: (22) ... 403` on this API call — GitHub's unauthenticated
          # API rate limit (60 req/hour per source IP) is easily exhausted on
          # shared GitHub-hosted runner IPs. Authenticate with the job's own
          # `GITHUB_TOKEN` (5,000 req/hour) to make this reliable.
          url=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/fizzbee-io/fizzbee/releases/latest \
            | grep -oE '"browser_download_url": *"[^"]*linux_x86\.tar\.gz"' \
            | grep -oE 'https://[^"]+' | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not resolve a fizzbee linux_x86 release asset from the GitHub API."
            exit 1
          fi
          echo "Resolved fizzbee asset: $url"
          curl -fsSL -o /tmp/fizzbee.tar.gz "$url"
          mkdir -p /tmp/fizzbee-install
          tar -xzf /tmp/fizzbee.tar.gz -C /tmp/fizzbee-install
          # v0.42.1 fix: `make verify` invokes the `fizz` wrapper script, not
          # the bare `fizzbee` binary. The wrapper needs its sibling files
          # (fizz.env, parser/, mbt_gen.zip) alongside it, so the whole
          # extracted directory — not just one file — must be on PATH.
          install_dir=$(find /tmp/fizzbee-install -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/fizzbee" --version || true
      # M1 (smoke + epoch-commit), M2 (frontier aggregation), M3 (sink 2PC),
      # M4 (self-fencing), M6 (shard migration), and M7
      # (control-plane Raft leader election, v0.45.2) are all genuinely green
      # (safety + liveness) — see formal/findings.md "Post-v0.42.3
      # Remediation" and the M7 entry. All seven specs are a hard gate: a red
      # result here blocks merge, per the binding v0.18 contract. M4's
      # exhaustive BFS completes in ~6s / ~31,000 nodes at MAX_OUTAGES
      # lowered from 2 to 1 (every other bound unchanged from its original
      # committed value — see formal/m4_self_fencing.fizz and findings.md
      # for the full state-space analysis); its former
      # `continue-on-error`/non-blocking special-casing and per-subshell
      # memory/wall-clock caps are removed. M7 completes in ~5s /
      # ~37,000 nodes at NUM_CONTROL_NODES=3, MAX_ELECTIONS=2,
      # MAX_WRITE_ATTEMPTS=2 — the pre-implementation gate for v0.45.2's
      # `rockstream-control` Raft group, per the binding v0.18 rule that
      # S0 (the model) must be green before S1+ (implementation) is written.
      - name: Formal verify — smoke, M1, M2, M3, M4, M6, M7, edge models (hard gate)
        if: steps.filter.outputs.run == 'true'
        run: |
          fizz formal/smoke.fizz
          fizz formal/m1_epoch_commit.fizz
          fizz formal/m2_frontier_agg.fizz
          fizz formal/m3_sink_2pc.fizz
          fizz formal/m4_self_fencing.fizz
          fizz formal/m6_shard_migration.fizz
          fizz formal/m7_control_plane_ha.fizz
          fizz formal/edge_quota_exhaustion.fizz
          fizz formal/edge_late_data.fizz

  nexmark-regression-gate:
    name: Nexmark regression gate
    needs: ci-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate qualification selection
        env:
          EXPENSIVE: ${{ needs.ci-policy.outputs.expensive }}
        run: test "$EXPENSIVE" = true || test "$EXPENSIVE" = false
      - uses: actions/checkout@v4
        if: needs.ci-policy.outputs.expensive == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: needs.ci-policy.outputs.expensive == 'true'
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        if: needs.ci-policy.outputs.expensive == 'true'
      - name: run nexmark bench
        if: needs.ci-policy.outputs.expensive == 'true'
        env:
          ROCKSTREAM_NEXMARK_GATE: "1"
        run: cargo bench -p rockstream-ops --bench nexmark -- --noplot | tee nexmark-bench.out
      - name: compare against v0.36 baseline
        if: needs.ci-policy.outputs.expensive == 'true'
        run: |
          if cargo run -p rockstream-ops --bin nexmark_regression_gate -- --baseline crates/rockstream-ops/benches/baseline/v0.36.json --output nexmark-bench.out; then
            exit 0
          fi
          for attempt in 1 2; do
            echo "nexmark benchmark gate failed; retry $attempt/2 to reject host-noise false positives"
            output="nexmark-bench-retry-${attempt}.out"
            ROCKSTREAM_NEXMARK_GATE=1 cargo bench -p rockstream-ops --bench nexmark -- --noplot | tee "$output"
            if cargo run -p rockstream-ops --bin nexmark_regression_gate -- --baseline crates/rockstream-ops/benches/baseline/v0.36.json --output "$output"; then
              exit 0
            fi
          done
          exit 1
      - name: Record intentional documentation-only exclusion
        if: needs.ci-policy.outputs.expensive == 'false'
        run: echo "Full qualification excluded by the recorded documentation-only PR policy."

  benchmark-suites:
    name: Benchmark (${{ matrix.suite }})
    needs: ci-policy
    if: needs.ci-policy.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [ops, storage, runtime, control]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-${{ matrix.suite }}
      - name: Run package benchmark and existing regression gate
        run: bash scripts/run-benchmark-gate.sh "${{ matrix.suite }}"
      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.suite }}
          overwrite: true
          path: "*-bench-*.out"
          if-no-files-found: error

  benchmark:
    name: Performance-regression gate (ops/storage/runtime/control)
    needs: [ci-policy, benchmark-suites]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all benchmark suites or the explicit prose exclusion
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-scope.py check-benchmarks

  release-version-check:
    name: Version / tag alignment
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Check Cargo.toml version matches git tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Git tag version : $TAG"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "ERROR: git tag v$TAG does not match Cargo.toml version $CARGO_VERSION"
            echo "Run: make release VERSION=$TAG"
            exit 1
          fi
          echo "OK: versions match"

  docker-build:
    needs: ci-policy
    if: needs.ci-policy.outputs.scope == 'full'
    name: Docker image (release binary)
    runs-on: ubuntu-latest
    outputs:
      image-id: ${{ steps.identity.outputs.image-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard against shipping a debug binary
        run: |
          # Found by the 2026-07-11 network-efficiency/cost-visibility review:
          # the Dockerfile used to build with plain `cargo build` and copy
          # `target/debug/rockstream` into the runtime image. Debug builds
          # carry none of the optimizations every published latency/throughput
          # number assumes, and no CI job ever ran `docker build`, so this
          # shipped silently. This step and the one below make sure both the
          # content and the build itself are checked on every push/PR.
          grep -q -- '--release' Dockerfile
          grep -q 'target/release/rockstream' Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate production image once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rockstream:ci-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ci-production-image
          cache-to: type=gha,mode=max,scope=ci-production-image
      - name: smoke-test the built image
        run: docker run --rm --entrypoint rockstream "rockstream:ci-$GITHUB_SHA" --help
      - id: identity
        name: Record candidate image identity
        run: |
          echo "image-id=$(docker image inspect --format '{{.Id}}' "rockstream:ci-$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          mkdir -p target/ci-image
          docker save --output target/ci-image/candidate.tar "rockstream:ci-$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-image-${{ github.sha }}
          path: target/ci-image/candidate.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
