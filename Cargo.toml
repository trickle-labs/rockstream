[workspace]
resolver = "2"
members = [
    "crates/rockstream-cli",
    "crates/rockstream-connectors",
    "crates/rockstream-control",
    "crates/rockstream-diff",
    "crates/rockstream-gateway",
    "crates/rockstream-ops",
    "crates/rockstream-oracle",
    "crates/rockstream-plan",
    "crates/rockstream-runtime",
    "crates/rockstream-sim",
    "crates/rockstream-sql",
    "crates/rockstream-storage",
    "crates/rockstream-types",
    "fuzz",
]

[profile.release]
overflow-checks = true

[workspace.package]
version = "0.42.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/trickle-labs/rockstream"

[workspace.dependencies]
libfuzzer-sys = "0.4"
# Shared workspace dependencies
arrow = "58"
arrow-flight = "58"
async-trait = "0.1"
bytes = "1"
prost = "0.13"
tonic = "0.12"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
datafusion = "53"
object_store = { version = "0.12", features = ["aws"] }
tempfile = "3"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["minio"] }
parking_lot = "0.12"
regex = "1"
parquet = "58"
iceberg = { version = "0.9", default-features = false }
deltalake = "0.32"
hex = "0.4"
hmac = "0.12"
base64 = "0.22"
proptest = "1"
rand = { version = "0.8", features = ["small_rng"] }
dashmap = "6"
lru = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
sha2 = "0.10"
md5 = "0.7"
antichain = { version = "0.3.1", features = ["serde"] }
slatedb = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
lz4_flex = "0.14"
zstd = "0.13"
pgwire = { version = "0.40", features = ["server-api"] }
sqlparser = "0.61.0"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
x509-parser = "0.16"
tokio-postgres-rustls = "0.13"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
rust_decimal = "1"
postgres-types = { version = "0.2", features = ["with-uuid-1", "with-serde_json-1", "array-impls"] }
rdkafka = "0.36"
aws-sdk-s3 = "1.70"
aws-config = "1.5"
csv = "1.3"


# Workspace crate references
rockstream-cli = { path = "crates/rockstream-cli" }
rockstream-connectors = { path = "crates/rockstream-connectors" }
rockstream-control = { path = "crates/rockstream-control" }
rockstream-diff = { path = "crates/rockstream-diff" }
rockstream-gateway = { path = "crates/rockstream-gateway" }
rockstream-ops = { path = "crates/rockstream-ops" }
rockstream-oracle = { path = "crates/rockstream-oracle" }
rockstream-plan = { path = "crates/rockstream-plan" }
rockstream-runtime = { path = "crates/rockstream-runtime" }
rockstream-sim = { path = "crates/rockstream-sim" }
rockstream-sql = { path = "crates/rockstream-sql" }
rockstream-storage = { path = "crates/rockstream-storage" }
rockstream-types = { path = "crates/rockstream-types" }
