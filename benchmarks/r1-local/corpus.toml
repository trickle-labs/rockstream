contract_version = 1
profile_id = "MBP-M5Pro-48GB-v1"

[load]
protocol = "pgwire"
lanes = 8
transaction_rows = 256
max_in_flight_transactions_per_lane = 1
visibility_barrier = "output_frontier_query_visible"
warm_up_seconds = 30
measurement_seconds = 60

[changes]
insert_percent = 50
update_percent = 30
delete_percent = 20
delete_semantics = "retraction"
oracle_comparison = "complete_multiset"

[freshness]
histogram_buckets_ms = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000]

[generation]
format = "r1-input-v1-big-endian"
change_rows_per_workload = 10000

[repetitions]
count = 5
order = ["a_then_b", "b_then_a", "a_then_b", "b_then_a", "a_then_b"]

[schemas.source]
primary_key = "id"
columns = ["id BIGINT NOT NULL", "group_id BIGINT NOT NULL", "dimension_id BIGINT NOT NULL", "value BIGINT NOT NULL", "active BOOLEAN NOT NULL"]

[schemas.dimension]
primary_key = "id"
columns = ["id BIGINT NOT NULL", "bucket BIGINT NOT NULL"]

[inputs]
workloads = [
  "workloads/factorized-join.toml",
  "workloads/one-key-persistence.toml",
  "workloads/ordinary-aggregate.toml",
  "workloads/ordinary-join.toml",
  "workloads/shared-arrangement.toml",
  "workloads/uniform-worker-scaling.toml",
]
sql = [
  "sql/factorized-join.sql",
  "sql/one-key-persistence.sql",
  "sql/ordinary-aggregate.sql",
  "sql/ordinary-join.sql",
  "sql/shared-arrangement-one.sql",
  "sql/shared-arrangement.sql",
  "sql/uniform-worker-scaling.sql",
]
