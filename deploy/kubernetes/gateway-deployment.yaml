apiVersion: apps/v1
kind: Deployment
metadata:
  name: rockstream-gateway
  labels:
    app.kubernetes.io/name: rockstream
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.59.22"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rockstream
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rockstream
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: rockstream-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/trickle-labs/rockstream:0.59.22
          imagePullPolicy: IfNotPresent
          command:
            - "rockstream"
            - "start"
            - "--role=gateway"
            - "--control=http://rockstream-control:9200"
            - "--listen=0.0.0.0:5432"
            - "--metrics-addr=0.0.0.0:9090"
            - "--storage=/data"
          ports:
            - name: pgwire
              containerPort: 5432
              protocol: TCP
            - name: management
              containerPort: 9090
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /ready
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9090
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
