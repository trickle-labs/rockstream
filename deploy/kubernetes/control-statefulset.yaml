apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rockstream-control
  labels:
    app.kubernetes.io/name: rockstream
    app.kubernetes.io/component: control
    app.kubernetes.io/version: "0.59.22"
spec:
  serviceName: rockstream-control
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rockstream
      app.kubernetes.io/component: control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rockstream
        app.kubernetes.io/component: control
    spec:
      serviceAccountName: rockstream-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control
          image: ghcr.io/trickle-labs/rockstream:0.59.22
          imagePullPolicy: IfNotPresent
          command:
            - "rockstream"
            - "start"
            - "--role=control"
            - "--raft-bind=0.0.0.0:9200"
            - "--metrics-addr=0.0.0.0:9090"
            - "--storage=/data"
          ports:
            - name: raft-rpc
              containerPort: 9200
              protocol: TCP
            - name: management
              containerPort: 9090
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /ready
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9090
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
