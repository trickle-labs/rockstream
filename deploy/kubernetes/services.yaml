apiVersion: v1
kind: Service
metadata:
  name: rockstream-gateway
  labels:
    app.kubernetes.io/name: rockstream
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - name: pgwire
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: management
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: rockstream
    app.kubernetes.io/component: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: rockstream-control
  labels:
    app.kubernetes.io/name: rockstream
    app.kubernetes.io/component: control
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: raft-rpc
      port: 9200
      targetPort: 9200
      protocol: TCP
    - name: management
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: rockstream
    app.kubernetes.io/component: control
---
apiVersion: v1
kind: Service
metadata:
  name: rockstream-worker
  labels:
    app.kubernetes.io/name: rockstream
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: dataplane-rpc
      port: 9100
      targetPort: 9100
      protocol: TCP
    - name: management
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: rockstream
    app.kubernetes.io/component: worker
