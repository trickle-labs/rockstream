{{- if .Values.compactor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-compactor
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: compactor
spec:
  replicas: {{ .Values.compactor.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: compactor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.compactor.managementPort }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: compactor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "rockstream"
            - "start"
            - "--role=worker"
            - "--control=http://{{ .Release.Name }}-control:{{ .Values.control.port }}"
            - "--listen=0.0.0.0:{{ .Values.compactor.port }}"
            - "--metrics-addr=0.0.0.0:{{ .Values.compactor.managementPort }}"
            - "--storage=/data"
          env:
            - name: ROCKSTREAM_COMPACTOR_ONLY
              value: "1"
            {{- include "rockstream.objectStoreEnv" . | nindent 12 }}
          ports:
            - name: compactor-rpc
              containerPort: {{ .Values.compactor.port }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.compactor.managementPort }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.compactor.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.compactor.managementPort }}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.compactor.managementPort }}
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
{{- end }}
