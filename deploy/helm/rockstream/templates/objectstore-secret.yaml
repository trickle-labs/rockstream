{{- if and .Values.objectStore.enabled (not .Values.objectStore.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-objectstore
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  accessKey: {{ .Values.objectStore.accessKey | quote }}
  secretKey: {{ .Values.objectStore.secretKey | quote }}
{{- end }}
