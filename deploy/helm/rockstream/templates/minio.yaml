{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":{{ .Values.minio.consolePort }}"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.objectStore.accessKey | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.objectStore.secretKey | quote }}
          ports:
            - name: s3
              containerPort: {{ .Values.minio.port }}
            - name: console
              containerPort: {{ .Values.minio.consolePort }}
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.minio.port }}
            periodSeconds: 5
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: {{ .Values.minio.port }}
      targetPort: {{ .Values.minio.port }}
    - name: console
      port: {{ .Values.minio.consolePort }}
      targetPort: {{ .Values.minio.consolePort }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: minio
{{- end }}
