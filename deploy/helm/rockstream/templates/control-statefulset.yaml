apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-control
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: control
spec:
  serviceName: {{ .Release.Name }}-control
  replicas: {{ .Values.control.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: control
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: control
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "rockstream"
            - "start"
            - "--role=control"
            - "--raft-bind=0.0.0.0:{{ .Values.control.port }}"
            - "--metrics-addr=0.0.0.0:{{ .Values.control.managementPort }}"
            - "--storage=/data"
          ports:
            - name: raft-rpc
              containerPort: {{ .Values.control.port }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.control.managementPort }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.control.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /ready
              port: {{ .Values.control.managementPort }}
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.control.managementPort }}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.control.managementPort }}
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.control.storageSize }}
