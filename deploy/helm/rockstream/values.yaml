# Default values for rockstream Helm chart (v0.59.22).

image:
  repository: ghcr.io/trickle-labs/rockstream
  pullPolicy: IfNotPresent
  tag: "0.59.22"

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: "rockstream-sa"

cluster:
  id: "k8s-cluster"
  shutdownTimeoutSecs: 30

gateway:
  replicas: 2
  port: 5432
  managementPort: 9090
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

worker:
  replicas: 3
  port: 9100
  managementPort: 9090
  storageSize: 50Gi
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 8000m
      memory: 16Gi

control:
  replicas: 3
  port: 9200
  managementPort: 9090
  storageSize: 20Gi
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
