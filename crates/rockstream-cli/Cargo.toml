[package]
name = "rockstream-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The single `rockstream` binary: one CLI for every node role"
default-run = "rockstream"

[[bin]]
name = "rockstream"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
rockstream-types = { workspace = true }
rockstream-control = { workspace = true }
rockstream-runtime = { workspace = true }
rockstream-gateway = { workspace = true }
rockstream-storage = { workspace = true }
object_store = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
rockstream-sql = { workspace = true }
rockstream-ops = { workspace = true }
rockstream-plan = { workspace = true }
arrow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }

[dev-dependencies]
rockstream-test-support = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
tokio-postgres = { workspace = true }
toml = { workspace = true }
