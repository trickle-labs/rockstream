[package]
name = "rockstream-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Source and sink connector implementations for RockStream"

[features]
# Forwards to rockstream-sim's `simulation` feature (buggify! fault
# injection). Off by default: production builds never inject faults.
simulation = ["rockstream-sim/simulation"]

[dependencies]
rockstream-types = { path = "../rockstream-types" }
rockstream-sim = { path = "../rockstream-sim" }
arrow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
iceberg = { workspace = true }
deltalake = { workspace = true }

[dev-dependencies]
rockstream-ops = { path = "../rockstream-ops" }
rockstream-plan = { path = "../rockstream-plan" }
rockstream-storage = { path = "../rockstream-storage" }
tokio = { workspace = true }
tempfile = { workspace = true }
object_store = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { version = "0.8", features = ["small_rng"] }
