[package]
name = "rockstream-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic simulation harness for RockStream (SimRuntime, buggify)"

[features]
default = []
simulation = []

[dependencies]
rockstream-types = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
bytes = "1"
rand = { version = "0.8", features = ["small_rng"] }
parking_lot = "0.12"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
rockstream-oracle = { path = "../rockstream-oracle" }
rockstream-control = { workspace = true }
rockstream-runtime = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["minio"] }
object_store = { workspace = true }
arrow = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rockstream-storage = { workspace = true }
rockstream-ops = { workspace = true }
rockstream-connectors = { workspace = true }
reqwest = { workspace = true }

