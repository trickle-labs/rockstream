[package]
name = "rockstream-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Storage abstraction layer wrapping SlateDB for RockStream"

[[bench]]
name = "storage_bench"
harness = false

[dependencies]
rockstream-types = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
slatedb = { workspace = true }
slatedb-common = "0.13.1"
moka = { version = "0.12.15", features = ["future"] }
object_store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rockstream-sim = { workspace = true }
rockstream-test-support.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
serial_test = "3"
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
object_store = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
