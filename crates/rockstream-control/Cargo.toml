[package]
name = "rockstream-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Control-plane service for RockStream cluster management"

[features]
simulation = ["rockstream-sim/simulation"]

[[bench]]
name = "frontier_bench"
harness = false

[dependencies]
bytes = { workspace = true, features = ["serde"] }
rockstream-plan = { workspace = true }
rockstream-storage = { workspace = true }
rockstream-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
object_store = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
slatedb = { workspace = true }
zstd = { workspace = true }
rockstream-sim = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["minio"] }
reqwest = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
rockstream-ops = { workspace = true }
serde_json = { workspace = true }
