[package]
name = "rockstream-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Control-plane service for RockStream cluster management"

[[bench]]
name = "frontier_bench"
harness = false

[dependencies]
rockstream-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
object_store = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
slatedb = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["minio"] }
reqwest = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
rockstream-ops = { workspace = true }
serde_json = { workspace = true }
