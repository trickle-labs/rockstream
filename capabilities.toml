[contract]
version = "v0.57"
roadmap = "NEW_ROADMAP.md"
promise = "RockStream ingests changing data, continuously maintains a documented SQL subset as durable materialized views, and serves globally committed results to PostgreSQL-compatible clients while surviving ordinary distributed-system failures without losing or silently corrupting committed state."

[[dispatch]]
id = "query_async_entry"
path = "crates/rockstream-gateway/src/server.rs"
symbol = "dispatch_async_with_conn"
surface = "pgwire query entry"

[[dispatch]]
id = "query_sync_entry"
path = "crates/rockstream-gateway/src/server.rs"
symbol = "dispatch_sync"
surface = "synchronous/catalog dispatch"

[[dispatch]]
id = "catalog_query"
path = "crates/rockstream-gateway/src/catalog_stubs.rs"
symbol = "handle_query"
surface = "delegated catalog dispatch"

[[dispatch]]
id = "sql_lowering"
path = "crates/rockstream-sql/src/frontend.rs"
symbol = "sql_to_plan_node"
surface = "DataFusion parse and PlanNode lowering"

[[dispatch]]
id = "view_dispatch"
path = "crates/rockstream-gateway/src/server.rs"
symbol = "handle_create_view"
surface = "materialized-view dispatch"

[[dispatch]]
id = "plan_compilation"
path = "crates/rockstream-ops/src/compile.rs"
symbol = "compile_node"
surface = "operator compilation"

[[dispatch]]
id = "response_encoding"
path = "crates/rockstream-gateway/src/server.rs"
symbol = "DataRowEncoder"
surface = "PostgreSQL response encoding"

[[dispatch]]
id = "postgres_cdc_runtime"
path = "crates/rockstream-connectors/src/postgres_cdc.rs"
symbol = "PostgresCdcSource"
surface = "PostgreSQL CDC source"

[[dispatch]]
id = "kafka_source_runtime"
path = "crates/rockstream-connectors/src/lib.rs"
symbol = "KafkaSource"
surface = "Kafka source"

[[dispatch]]
id = "kafka_sink_runtime"
path = "crates/rockstream-connectors/src/kafka_sink.rs"
symbol = "KafkaSink"
surface = "Kafka sink"

[[capability]]
id = "language.query-read"
kind = "language"
name = "Query and read surface"
tier = "Core"
reachability = "SQL over pgwire"
dispatch = ["query_async_entry", "sql_lowering", "response_encoding"]
proof = "crates/rockstream-gateway/tests/gateway_dml_tests.rs::test_create_view_and_select"
documentation = "docs/language-features.md#implemented-today"

