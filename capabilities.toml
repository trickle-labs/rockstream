[contract]
version = "v0.59.8"

roadmap = "NEW_ROADMAP.md"
promise = "RockStream ingests changing data, continuously maintains a documented SQL subset as durable materialized views, and serves globally committed results to PostgreSQL-compatible clients while surviving ordinary distributed-system failures without losing or silently corrupting committed state."

[[contract.tier_decision]]
capability = "language.aggregates"
old_tier = "Core"
new_tier = "Experimental"
reason = "The exact aggregate type matrix exposes unsupported floating-point and text-key combinations, so the broad aggregate claim is demoted rather than documented aspirationally."
evidence = "crates/rockstream-gateway/tests/core_operator_semantics_e2e_tests.rs::core_aggregate_text_f64_sum"

[[contract.tier_decision]]
capability = "language.relational-operators"
old_tier = "Core"
new_tier = "Experimental"
reason = "The join matrix proves integer and text keys but rejects floating-point keys and text semi/anti joins with RS-1019, so the broad relational claim is demoted."
evidence = "crates/rockstream-gateway/tests/core_operator_semantics_e2e_tests.rs::core_join_inner_f64"

[[contract.tier_decision]]
capability = "language.analytics-time"
old_tier = "Core"
new_tier = "Experimental"
reason = "The window matrix proves supported rank and navigation paths but the timestamp-key cells remain unsupported, so the broad analytics-time claim is demoted."
evidence = "crates/rockstream-gateway/tests/core_operator_semantics_e2e_tests.rs::core_window_row_number_timestamp"

[[dispatch]]
id = "query_async_entry"
path = "crates/rockstream-gateway/src/server.rs"
symbol = "dispatch_async_with_conn"
surface = "pgwire query entry"

[[dispatch]]
id = "query_sync_entry"
path = "crates/rockstream-gateway/src/server.rs"
