[[capability]]
id = "language.query-read"
kind = "language"
name = "Query and read surface"
tier = "Core"
reachability = "SQL over pgwire"
dispatch = ["query_async_entry", "sql_lowering", "response_encoding"]
proof = "crates/rockstream-gateway/tests/gateway_dml_tests.rs::test_create_view_and_select"
proof_levels_achieved = ["L0", "L1", "L2", "L3", "L5"]
min_proof_level = ["L0", "L1", "L2", "L3", "L5"]
documentation = "docs/language-features.md#implemented-today"
behavior = [
  { behavior = "incremental", statement = "A committed row delta is reflected in the same SELECT transcript as the corresponding source change.", proof = "crates/rockstream-gateway/tests/core_operator_semantics_e2e_tests.rs::core_query_read_incremental" },
  { behavior = "backfill", statement = "A snapshot read returns every committed source row before subsequent deltas are observed.", proof = "crates/rockstream-gateway/tests/core_operator_semantics_e2e_tests.rs::core_query_read_backfill" },
  { behavior = "checkpoint_recovery", statement = "Reopening the local durable shard restores the committed read transcript.", proof = "crates/rockstream-gateway/tests/core_operator_semantics_e2e_tests.rs::core_query_read_checkpoint_recovery" },
  { behavior = "state_growth", statement = "Read results are materialized per query and do not retain an unbounded process buffer.", proof = "crates/rockstream-gateway/tests/core_operator_semantics_e2e_tests.rs::core_query_read_state_growth", bound = "one query result set", metric = "query_result_rows", on_bound = "the query fails with its RS-coded resource error" },
  { behavior = "failure", statement = "Invalid read input returns an actionable RS-coded error instead of an empty success.", proof = "crates/rockstream-gateway/tests/core_operator_semantics_e2e_tests.rs::core_query_read_failure" },
]

